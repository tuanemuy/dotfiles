model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approvals_reviewer = "user"

[tui]
theme = "gruvbox-light"
# Match the Claude statusline: metrics first (context, 5h, weekly), model last.
status_line = ["context-used", "five-hour-limit", "weekly-limit", "model-with-reasoning"]

[notice]
hide_full_access_warning = true

[features]
hooks = true

# home.nix copies this to ~/.codex/config.toml rather than symlinking it, so
# edits made over there are untracked and are discarded whenever this file
# changes. Edit here, then switch.
